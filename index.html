<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gear Calculator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1720">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GearCalc">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f1720;
    color: #e6edf3;
    margin: 0;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
    color: #ffffff;
  }
  .sub {
    color: #8aa0b3;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .card {
    background: #16212c;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #24333f;
  }
  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .field {
    flex: 1;
  }
  label {
    display: block;
    font-size: 12px;
    color: #8aa0b3;
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #2c3e4c;
    background: #0f1720;
    color: #fff;
    font-size: 15px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #4dabf7;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  td {
    padding: 8px 4px;
    border-bottom: 1px solid #24333f;
  }
  td.label { color: #8aa0b3; }
  td.val { text-align: right; font-weight: 600; color: #4dabf7; }
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #6b8ba4;
    margin: 18px 0 8px 0;
  }
  .highlight {
    background: #142838;
    border: 1px solid #1e4258;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .highlight .val { color: #74d68d; font-size: 16px; }
</style>
</head>
<body>

<h1>Spur Gear Calculator</h1>
<div class="sub">Module system — enter module & teeth to get all gear dimensions</div>

<div class="card">
  <div class="section-title" style="margin-top:0;">Find Module (reverse calculate)</div>
  <div class="row">
    <div class="field">
      <label>Measured Diameter (mm)</label>
      <input type="number" id="measuredDia" placeholder="e.g. 84" step="0.01" oninput="calcModule()">
    </div>
    <div class="field">
      <label>Diameter Type</label>
      <select id="diaType" onchange="calcModule()">
        <option value="OD">Outside (Tip) Ø</option>
        <option value="PCD">Pitch Circle Ø</option>
        <option value="RD">Root Ø</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>No. of Teeth (measured gear)</label>
      <input type="number" id="measuredTeeth" placeholder="e.g. 40" step="1" oninput="calcModule()">
    </div>
    <div class="field" style="display:flex; align-items:flex-end;">
      <button onclick="useModule()" style="width:100%; padding:10px; border-radius:8px; border:1px solid #2c3e4c; background:#1e4258; color:#fff; font-size:14px; cursor:pointer;">Use this module ↓</button>
    </div>
  </div>
  <div class="highlight" id="moduleResult" style="display:none;">
    <table style="width:100%;"><tr><td class="label">Calculated Module</td><td class="val" id="moduleResultVal">—</td></tr></table>
  </div>
  <div class="sub" style="margin-bottom:0; font-size:11px;">Tip: measure tip (outside) diameter with calipers — it's the easiest to get accurately on a real gear.</div>
</div>

<div class="card">
  <div class="row">
    <div class="field">
      <label>Module (mm)</label>
      <input type="number" id="module" value="2" step="0.1" oninput="calc()">
    </div>
    <div class="field">
      <label>No. of Teeth (T1)</label>
      <input type="number" id="teeth1" value="40" step="1" oninput="calc()">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Pressure Angle (°)</label>
      <select id="pressureAngle" onchange="calc()">
        <option value="20" selected>20°</option>
        <option value="14.5">14.5°</option>
        <option value="25">25°</option>
      </select>
    </div>
    <div class="field">
      <label>Mating Gear Teeth (T2) — optional</label>
      <input type="number" id="teeth2" placeholder="e.g. 20" oninput="calc()">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Driver RPM (Gear 1)</label>
      <input type="number" id="rpm1" placeholder="e.g. 1000" step="1" oninput="calc()">
    </div>
    <div class="field">
      <label>Input Torque (Nm)</label>
      <input type="number" id="torque1" placeholder="e.g. 50" step="0.1" oninput="calc()">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Transmission Efficiency (%)</label>
      <input type="number" id="efficiency" placeholder="98" step="1" oninput="calc()">
    </div>
    <div class="field"></div>
  </div>
</div>

<div class="card">
  <div class="section-title">Gear 1 Dimensions</div>
  <table id="gear1Table"></table>

  <div class="section-title">Tooth Proportions</div>
  <table id="toothTable"></table>

  <div id="gear2Section" style="display:none;">
    <div class="section-title">Mesh & Speed</div>
    <table id="meshTable"></table>
  </div>
</div>

<script>
function calc() {
  const m = parseFloat(document.getElementById('module').value) || 0;
  const T1 = parseFloat(document.getElementById('teeth1').value) || 0;
  const phi = parseFloat(document.getElementById('pressureAngle').value) || 20;
  const T2raw = document.getElementById('teeth2').value;
  const T2 = parseFloat(T2raw);

  const PCD = m * T1;
  const OD = m * (T1 + 2);
  const RD = m * (T1 - 2.5);
  const addendum = m;
  const dedendum = 1.25 * m;
  const wholeDepth = 2.25 * m;
  const workingDepth = 2 * m;
  const clearance = 0.25 * m;
  const circularPitch = Math.PI * m;
  const toothThickness = circularPitch / 2;
  const baseCircle = PCD * Math.cos(phi * Math.PI / 180);

  const fmt = (n) => Number.isFinite(n) ? n.toFixed(3).replace(/\.?0+$/,'') : '—';

  document.getElementById('gear1Table').innerHTML = `
    <tr><td class="label">Pitch Circle Diameter (PCD)</td><td class="val">${fmt(PCD)} mm</td></tr>
    <tr><td class="label">Outside (Tip) Diameter</td><td class="val">${fmt(OD)} mm</td></tr>
    <tr><td class="label">Root Diameter</td><td class="val">${fmt(RD)} mm</td></tr>
    <tr><td class="label">Base Circle Diameter</td><td class="val">${fmt(baseCircle)} mm</td></tr>
  `;

  document.getElementById('toothTable').innerHTML = `
    <tr><td class="label">Addendum</td><td class="val">${fmt(addendum)} mm</td></tr>
    <tr><td class="label">Dedendum</td><td class="val">${fmt(dedendum)} mm</td></tr>
    <tr><td class="label">Whole Depth</td><td class="val">${fmt(wholeDepth)} mm</td></tr>
    <tr><td class="label">Working Depth</td><td class="val">${fmt(workingDepth)} mm</td></tr>
    <tr><td class="label">Clearance</td><td class="val">${fmt(clearance)} mm</td></tr>
    <tr><td class="label">Circular Pitch</td><td class="val">${fmt(circularPitch)} mm</td></tr>
    <tr><td class="label">Tooth Thickness</td><td class="val">${fmt(toothThickness)} mm</td></tr>
  `;

  const gear2Section = document.getElementById('gear2Section');
  const rpm1 = parseFloat(document.getElementById('rpm1').value);
  const torque1 = parseFloat(document.getElementById('torque1').value);
  let eff = parseFloat(document.getElementById('efficiency').value);
  if (!eff || eff <= 0) eff = 100;
  const pitchLineVel = (rpm1 && PCD) ? (Math.PI * PCD * rpm1) / 60000 : null; // m/min, PCD in mm
  const power1 = (torque1 && rpm1) ? (torque1 * rpm1 * 2 * Math.PI) / 60000 : null; // kW

  let rows = '';
  if (pitchLineVel !== null) {
    rows += `<tr><td class="label">Pitch Line Velocity</td><td class="val">${fmt(pitchLineVel)} m/min</td></tr>`;
  }
  if (power1 !== null) {
    rows += `<tr><td class="label">Input Power</td><td class="val">${fmt(power1)} kW</td></tr>`;
  }

  if (T2 && T2 > 0) {
    gear2Section.style.display = 'block';
    const centerDistance = m * (T1 + T2) / 2;
    const gearRatio = T2 / T1;
    const PCD2 = m * T2;
    rows = `<tr><td class="label">Gear 2 PCD</td><td class="val">${fmt(PCD2)} mm</td></tr>
      <tr><td class="label">Center Distance</td><td class="val">${fmt(centerDistance)} mm</td></tr>
      <tr><td class="label">Gear Ratio (T2/T1)</td><td class="val">${fmt(gearRatio)} : 1</td></tr>` + rows;

    if (rpm1) {
      const rpm2 = rpm1 * T1 / T2;
      rows += `<tr><td class="label">Driven Gear RPM</td><td class="val">${fmt(rpm2)} rpm</td></tr>`;
    }
    if (torque1) {
      const torque2 = torque1 * gearRatio * (eff / 100);
      rows += `<tr><td class="label">Output Torque (Gear 2)</td><td class="val">${fmt(torque2)} Nm</td></tr>`;
    }
    if (power1 !== null) {
      const power2 = power1 * (eff / 100);
      rows += `<tr><td class="label">Output Power</td><td class="val">${fmt(power2)} kW</td></tr>`;
    }
  }

  if (rows) {
    gear2Section.style.display = 'block';
    document.getElementById('meshTable').innerHTML = rows;
  } else {
    gear2Section.style.display = 'none';
  }
}

function calcModule() {
  const dia = parseFloat(document.getElementById('measuredDia').value);
  const T = parseFloat(document.getElementById('measuredTeeth').value);
  const type = document.getElementById('diaType').value;
  const resultBox = document.getElementById('moduleResult');
  const resultVal = document.getElementById('moduleResultVal');

  if (!dia || !T || dia <= 0 || T <= 0) {
    resultBox.style.display = 'none';
    return;
  }

  let m;
  if (type === 'OD') {
    m = dia / (T + 2);
  } else if (type === 'PCD') {
    m = dia / T;
  } else if (type === 'RD') {
    m = dia / (T - 2.5);
  }

  resultBox.style.display = 'block';
  resultVal.textContent = m.toFixed(4).replace(/0+$/,'').replace(/\.$/,'') + ' mm';

  // Suggest nearest standard module
  const standardModules = [0.5,0.6,0.8,1,1.25,1.5,2,2.5,3,4,5,6,8,10,12,16,20,25];
  let nearest = standardModules.reduce((a,b) => Math.abs(b-m) < Math.abs(a-m) ? b : a);
  resultVal.innerHTML = m.toFixed(4).replace(/0+$/,'').replace(/\.$/,'') + ' mm <span style="color:#8aa0b3; font-size:12px; font-weight:400;">(nearest standard: ' + nearest + ')</span>';

  window._lastCalcModule = nearest;
  window._lastCalcTeeth = T;
}

function useModule() {
  if (window._lastCalcModule === undefined) return;
  document.getElementById('module').value = window._lastCalcModule;
  document.getElementById('teeth1').value = window._lastCalcTeeth;
  calc();
  document.querySelector('.card:nth-of-type(2)').scrollIntoView({behavior:'smooth'});
}

calc();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>

</body>
</html>
